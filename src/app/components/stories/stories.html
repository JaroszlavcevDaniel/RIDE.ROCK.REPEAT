<div class="container text-light m-2 ">
 <app-popup-stories></app-popup-stories>

  <div *ngIf="articles.length > 0; else noArticles" >
    
    <div class="row justify-content-center" style="gap: 10px !important;">

   
    <div *ngFor="let article of articles" class="article-card col-lg-5 col-12 m-1 glassgow rounded-3 container align-content-center card-hover"
    (click)="onClick()" [routerLink]="['/', lang, 'articles', article[lang].slug]">
      <div class="row">

       <div class="col-6 align-items-center">
      <img [src]="article.image" alt="motorcycle article image" class="card-img-top article-image p-1 m-1 rounded-3" >
    </div>
      
      <div class="card-body col-6" style="text-align: justify !important">
       
        <h5 *ngIf="isBrowser" class="card-title text-warning fw-bolder p-2 new-rocker-regular">{{ article[lang]?.title | toMarkdownPipe }}</h5>
        
        <h6 *ngIf="isBrowser" class="p-2 archivo-black text-uppercase" [innerHTML]="article[lang].excerpt | toMarkdownPipe">{{ article[lang].excerpt | toMarkdownPipe }}</h6>
        
        <!-- Read More Link -->
   <!-- <a class="text-light btn bg-black text-decoration-none fw-bold btn-animate btn-ripple" >
        {{ lang === 'hu' ? 'Olvasom tovább' : 'Read more' }} 
      </a> -->
      </div>
      </div>
      </div>
    </div>
  </div>





  
  <!-- No articles fallback -->
  <ng-template #noArticles>
    <p *ngIf="isBrowser" class="no-articles">
      {{ lang === 'hu' ? 'Nincsenek elérhető cikkek.' : 'No articles available.' | toMarkdownPipe }}
    </p>
  </ng-template>
  
</div>
