
<nav class="navbar navbar-expand-lg navbar-dark bg-dark text-light px-4 fixed-top mb-5">

  <a class="navbar-brand" [routerLink]="['/', currentLang]">Ride. Rock. Repeat. </a>
<img style="width: 4% !important;" src="images/ride_rock_repeat_logo.png" alt="Ride. Rock. Repeat. logo" class="rounded-5"> 
<ng-container *ngIf="content$ | async as content">
<a *ngIf="showBackButton" class="m-2 btn btn-secondary text-light fw-bolder btn-ripple btn-animate" 
(click)="goBack()"> ←  {{ content.navbar.back }}</a>
</ng-container>
  <!-- TOGGLER (mobilhoz) -->
  <button
    class="navbar-toggler"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#mainNavbar"
    aria-controls="mainNavbar"
    aria-expanded="false"
    aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- COLLAPSE WRAPPER -->
  <div class="collapse navbar-collapse" id="mainNavbar">

    <!-- NG-CONTAINER, NEM UL -->
    <ng-container *ngIf="content$ | async as content">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link text-light" [routerLink]="['/', currentLang, 'about']">
            {{ content.navbar.about }}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-light" [routerLink]="['/', currentLang, 'stories']">
            {{ content.navbar.travel }}
          </a>
        </li>

          <li class="nav-item">
          <a class="nav-link text-light" [routerLink]="['/', currentLang, 'playlists']">
            {{ content.navbar.playlists }}
          </a>
        </li>

          <li class="nav-item me-5">
          <a class="nav-link text-light" [routerLink]="['/', currentLang, 'contact']">
            {{ content.navbar.contact }}
          </a>
        </li>

        <li class="nav-item ">
          <button *ngIf="!user" (click)="login()" class="btn btn-secondary btn-pulse">
         Login by Google
        </button>

        <div *ngIf="user">
          👋 {{ user.displayName }}
           <!-- <img
          
          [src]="userPhoto"
          alt="avatar"
          width="36"
          height="36"
          class="rounded-circle me-2 "
        /> -->
          <button (click)="logout()" class="btn btn-secondary mx-4">LogOut</button>
        </div>
        </li>

      </ul>

    </ng-container>

    <!-- LANGUAGE SWITCH -->
    <div class="d-flex gap-2">
      <button
        class="btn btn-sm"
        [class.btn-light]="currentLang === 'hu'"
        [class.btn-outline-light]="currentLang !== 'hu'"
        (click)="switchLanguage('hu')">
        🇭🇺 HU
      </button>

      <button
        class="btn btn-sm"
        [class.btn-light]="currentLang === 'en'"
        [class.btn-outline-light]="currentLang !== 'en'"
        (click)="switchLanguage('en')">
        🇬🇧 EN
      </button>
    </div>

  </div>
</nav>
