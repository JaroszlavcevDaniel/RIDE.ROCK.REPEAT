<div class="container" *ngIf="content$ | async as content">


  <p class="text-light" style="text-align: justify !important">
    {{ content.contact.contactText | toMarkdownPipe }}
  </p>

  <div class="d-flex gap-5 align-items-center my-5">

  <a href="https://www.instagram.com/zelikdaniel?igsh=MWZ6cm9tdGxmMGVpeA%3D%3D&utm_source=qr"
     target="_blank"
     aria-label="Instagram"
     class="social-icon">
    <i class="bi bi-instagram"></i>
  </a>

  <a href="https://www.facebook.com/daniel.zelik.7/"
     target="_blank"
     aria-label="Facebook"
     class="social-icon">
    <i class="bi bi-facebook"></i>
  </a>

  <a href="https://github.com/JaroszlavcevDaniel"
     target="_blank"
     aria-label="GitHub"
     class="social-icon">
    <i class="bi bi-github"></i>
  </a>

</div>


  <p class="text-light mt-3" style="text-align: justify !important">
    {{ content.contact.contactTextTwo | toMarkdownPipe }}
  </p>

  <form class="mt-4" [formGroup]="presentForm" (ngSubmit)="onSubmit()" action="https://formspree.io/f/XXXXXXX" method="POST">

    <div class="col-md-6 my-3">
      <label class="form-label text-light"> {{ content.contact.yourName | toMarkdownPipe  }}</label>
      <input    class="form-control"   type="text" formControlName="yourName">
    </div>

    <div class="col-md-6 my-3">
      <label class="form-label text-light">{{ content.contact.yourEmail | toMarkdownPipe }}</label>
      <input   class="form-control"  type="email" formControlName="yourEmail">
    </div>

    <div class="col-md-8 my-3">
      <label class="form-label text-light">{{ content.contact.yourMessage | toMarkdownPipe }}</label>
      <textarea   class="form-control"  rows="4"  formControlName="yourMessage"></textarea>
    </div>

    <button
  type="submit"
  class="btn btn-success m-2"
  [disabled]="presentForm.invalid || sending">
  {{ sending ? 'Küldés...' : 'Küldés' | toMarkdownPipe }}
  </button>



  </form>
</div>

<!-- SUCCESS MESSAGE -->
<div
  *ngIf="success"
  class="success-box text-center my-4">

  <div class="checkmark">✓</div>
  <p class="mb-0">Üzenet sikeresen elküldve</p>

</div>
