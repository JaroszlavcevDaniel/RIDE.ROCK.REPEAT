<div class="container  mt-0 ">
  <div class="row mt-0">



<!-- KIEMELT CÍKK - MOTOROZÁS style="max-width: 540px;"--> 




<div class="col-lg-6 col-md-12 card glassgow text-light rounded-3  card-hover mb-5 mt-1"  *ngIf="featuredArticle as article"

>
  <div class="row g-0 align-items-center" (click)="onClick()" [routerLink]="['/', lang, 'articles', article[lang].slug]">
    <div class="col-lg-3">
        <img src="images/myTrip.png" class="article-image-main rounded-3 " alt="motorcycle article image">
    </div>
    <div class="col-lg-7">
      <div class="card-body" style="text-align: justify !important">
        <small *ngIf="isBrowser" class="card-title text-light archivo-black text-uppercase" [innerHTML]=" article[lang].featuredText | toMarkdownPipe">{{ article[lang].featuredText | toMarkdownPipe }} </small>
        <h5 *ngIf="isBrowser" class="card-title fw-bolder archivo-black text-warning mb-0 text-uppercase"> {{ article[lang].title | toMarkdownPipe }} </h5>
      <small  *ngIf="isBrowser" class="archivo-black text-uppercase" [innerHTML]=" article[lang].excerpt | toMarkdownPipe">{{ article[lang].excerpt | toMarkdownPipe }}

      </small>
      </div>
    </div>
  </div>
</div>

<!-- KEIEMELT PLAYLISZT  -->
 <div class="col-lg-6 col-md-12 card glassgow text-light rounded-3  card-hover mb-5 mt-1" *ngIf="featuredPlaylist as article"
 (click)="onClick()"  [routerLink]="['/', lang, 'articles', article[lang].slug]">
  <div class="row g-0 align-items-center">
    <div class="col-lg-3">
      <img src="images/thumb_95458_0_1080_0_0_auto.jpg" class="card-img-top article-image-main p-1 m-1 rounded-3 " alt="playlist picture">
    </div>
    <div class="col-lg-7">
      <div class="card-body" style="text-align: justify !important">
        <small *ngIf="isBrowser" class="card-title text-light text-uppercase archivo-black" [innerHTML]="article[lang].featuredText | toMarkdownPipe">{{ article[lang].featuredText | toMarkdownPipe }} </small>
        <h5 *ngIf="isBrowser" class="card-title fw-bolder archivo-black text-uppercase text-warning mb-0" [innerHTML]="article[lang].title  | toMarkdownPipe"> {{ article[lang].title | toMarkdownPipe }} </h5>
        <!-- <p class="card-text">{{ article[lang].excerpt }} </p> -->
      <small *ngIf="isBrowser" class="archivo-black text-uppercase" [innerHTML]="article[lang].excerpt | toMarkdownPipe">{{ article[lang].excerpt | toMarkdownPipe }}
      <!-- <a class="text-light btn bg-black text-decoration-none fw-bold btn-ripple btn-animate m-2" >
        {{ lang === 'hu' ? 'Olvasom tovább' : 'Read more' }} 
      </a> -->
      </small>
      </div>
    </div>
  </div>
</div>


<div class="col-12">

<app-mapper class=""></app-mapper>

</div>

</div>
</div>
