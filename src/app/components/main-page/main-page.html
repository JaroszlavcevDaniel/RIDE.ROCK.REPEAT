<div class="container bg-black mt-0 ">
  <div class="row mt-0">



<!-- KIEMELT CÍKK - MOTOROZÁS style="max-width: 540px;"--> 

<div class="col-lg-7 col-md-12">


<div class="card bg-dark text-light rounded-3 m-1"  *ngIf="featuredArticle as article">
  <div class="row g-0 align-items-center">
    <div class="col-lg-3">
        <img src="images/myTrip.png" class="article-image-main rounded-3 " alt="motorcycle article image">
    </div>
    <div class="col-lg-7">
      <div class="card-body">
        <small class="card-title text-light">{{ article[lang].featuredText }} </small>
        <h5 class="card-title fw-bolder new-rocker-regular text-warning mb-0"> {{ article[lang].title }} </h5>
      <small class="card-text">{{ article[lang].excerpt }}
      <a class="text-light btn bg-black text-decoration-none fw-bold btn-animate btn-ripple" (click)="onClick()" [routerLink]="['/', lang, 'articles', article[lang].slug]">
        {{ lang === 'hu' ? 'Olvasom tovább' : 'Read more' }} 
      </a>
      </small>
      </div>
    </div>
  </div>
</div>

<!-- KEIEMELT PLAYLISZT  -->
 <div class="card bg-dark text-light rounded-3 m-1" *ngIf="featuredPlaylist as article">
  <div class="row g-0 align-items-center">
    <div class="col-lg-3">
      <img src="images/nu_metal.png" class="card-img-top article-image-main p-1 m-1 rounded-3 " alt="plylist picture">
    </div>
    <div class="col-lg-7">
      <div class="card-body">
        <small class="card-title text-light ">{{ article[lang].featuredText }} </small>
        <h5 class="card-title fw-bolder new-rocker-regular text-warning mb-0"> {{ article[lang].title }} </h5>
        <!-- <p class="card-text">{{ article[lang].excerpt }} </p> -->
      <small class="card-text">{{ article[lang].excerpt }}
      <a class="text-light btn bg-black text-decoration-none fw-bold btn-ripple btn-animate m-2" (click)="onClick()"  [routerLink]="['/', lang, 'articles', article[lang].slug]">
        {{ lang === 'hu' ? 'Olvasom tovább' : 'Read more' }} 
      </a>
      </small>
      </div>
    </div>
  </div>
</div>

</div>

    <!-- LOGO -->

<div class="col-lg-5 col-md-12 d-flex justify-content-center logo-wrapper mt-1 bg-transparent">
  <img src="images/RRR_logo_big.png"
       alt="Ride.Rock.Repeat logo"
       class="img-fluid w-75">
</div>






<!-- konténer vége -->
</div>
</div>
