<div class="container bg-black">
  <div class="row">


<!-- KIEMELT CÍKK - MOTOROZÁS style="max-width: 540px;"--> 
<div class="col-lg-4 col-md card mb-3 bg-dark text-light m-2 rounden-2"  *ngIf="featuredArticle as article">
  <div class="row g-0">
    <div class="col-md-6">
      <!-- <img [src]="article.image" alt="Featured article image" class="" > -->
       <img src="images/myTrip.png" class="img-fluid rounded-2 p-1 m-1" alt="">
    </div>
    <div class="col-md-6">
      <div class="card-body">
        <h4 class="card-title text-light ">{{ article[lang].featuredText }} </h4>
        <h5 class="card-title fw-bolder"> {{ article[lang].title }} </h5>
        <!-- <p class="card-text">{{ article[lang].excerpt }} </p> -->
      <p class="card-text">{{ article[lang].excerpt }}
      <a class="text-light btn bg-black text-decoration-none fw-bold"[routerLink]="['/', lang, 'articles', article[lang].slug]">
        {{ lang === 'hu' ? 'Olvasom tovább' : 'Read more' }} 
      </a>
      </p>
      </div>
    </div>
  </div>
</div>

<!-- LOGO -->
<div class="col-lg-3 align-middle d-flex p-2 m-4">

      <img class="h-100 card-img w-100 align-middle rounded-5" src="images/ride_rock_repeat_logo.png" alt="">
  
 </div>
<!-- KEIEMELT PLAYLISZT  -->
 <div class="col-lg-4 card mb-3 bg-dark text-light m-2" *ngIf="featuredPlaylist as article">
  <div class="row g-0">
    <div class="col-md-6">
      <img src="images/nu_metal.png" class="img-fluid rounded-2 p-1 m-1" alt="">
    </div>
    <div class="col-md-6">
      <div class="card-body">
        <h4 class="card-title text-light ">{{ article[lang].featuredText }} </h4>
        <h5 class="card-title fw-bolder"> {{ article[lang].title }} </h5>
        <!-- <p class="card-text">{{ article[lang].excerpt }} </p> -->
      <p class="card-text">{{ article[lang].excerpt }}
      <a class="text-light btn bg-black text-decoration-none fw-bold"[routerLink]="['/', lang, 'articles', article[lang].slug]">
        {{ lang === 'hu' ? 'Olvasom tovább' : 'Read more' }} 
      </a>
      </p>
      </div>
    </div>
  </div>
</div>

<!-- konténer vége -->
</div>
</div>
