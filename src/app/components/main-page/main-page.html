<div class="container bg-black">
  <div class="row">


<!-- KIEMELT CÍKK - MOTOROZÁS style="max-width: 540px;"--> 
<div class="col-lg-4 col-md-12 card mb-3 bg-dark text-light mt-3 rounden-2"  *ngIf="featuredArticle as article">
  <div class="row g-0 align-items-center">
    <div class="col-md-6">
        <img src="images/myTrip.png" class="card-img-top article-image p-1 m-1 rounded-3 " alt="motorcycle article image">
    </div>
    <div class="col-md-6">
      <div class="card-body">
        <h5 class="card-title text-warning ">{{ article[lang].featuredText }} </h5>
        <h5 class="card-title fw-bolder new-rocker-regular"> {{ article[lang].title }} </h5>
      <p class="card-text">{{ article[lang].excerpt }}
      <a class="text-light btn bg-black text-decoration-none fw-bold btn-animate btn-ripple m-2" (click)="onClick()" [routerLink]="['/', lang, 'articles', article[lang].slug]">
        {{ lang === 'hu' ? 'Olvasom tovább' : 'Read more' }} 
      </a>
      </p>
      </div>
    </div>
  </div>
</div>

<!-- LOGO -->
<div class="col-lg-3 col-md-12 align-middle d-flex p-2 m-4 logo-wrapper"
style="background-image: url(images/ride_rock_repeat_logo.png); background-position: center; background-size: cover;">
