<section class="article-comments mt-5">

  <h4 class="mb-3 text-light">Comments 👥 Kommentek</h4>

  <!-- COMMENTS LIST -->
  <ng-container *ngIf="comments$ | async as comments">
    <div *ngIf="comments.length === 0" class="text-light mb-3">
      No comments yet. Be the first 🤘 Még nincsenek hozzászólások. Légy az első!
    </div>

    <div *ngFor="let comment of comments" class="comment mb-3 p-3 rounded border">
      <div class="d-flex align-items-center mb-2">
        <img
          *ngIf="comment.userPhoto"
          [src]="comment.userPhoto"
          alt="avatar"
          width="36"
          height="36"
          class="rounded-circle me-2"
        />

        <div>
          <strong>{{ comment.userName }}</strong><br />
          <small class="text-muted">
            {{ comment.createdAt?.toDate() | date:'medium' }}
          </small>
        </div>
      </div>

      <p class="mb-0">{{ comment.text }}</p>
    </div> 
  </ng-container>

  <!-- COMMENT FORM -->
  <ng-container *ngIf="user$ | async as user; else loginHint" class="mb-2">
    <div class="mt-4">
      <textarea
        [(ngModel)]="newComment"
        class="form-control"
        rows="3"
        placeholder="Write a comment... 👀 Írd ide a kommented..."
      ></textarea>

      <button
        class="btn btn-success m-4"
        (click)="submitComment(user)"
        [disabled]="!newComment.trim()"
      >
        Post comment ☑️ Hozzászólás közzététele
      </button>
    </div>
  </ng-container>

  <!-- LOGIN HINT -->
  <ng-template #loginHint>
    <p class="text-light mt-4">
      Please log in with Google to comment. 👀 Kérlek, jelentkezz be Google-fiókkal a hozzászóláshoz.
    </p>
  </ng-template>

</section>
